  <section
    class="relative w-full h-[270px] "
    [style.background]="
      'linear-gradient(to bottom,' +
      dominantColor +
      ' 0%,' +
      darkDominantColor +
      ' 100%)'
    ">
    <div class="flex items-end gap-6 h-full p-8 text-white">
      <img
        [src]="img"
        class="w-54 h-54 shadow-2xl object-cover rounded"
        alt="Artist" />

      <div>
        <p class="text-sm uppercase tracking-widest text-gray-300">{{contentType | uppercase}}</p>

        <h1 class="text-6xl font-bold leading-tight">
          {{ title }}
        </h1>

        <p class="text-sm text-gray-300 mt-2">
          {{ description }}
        </p>
      </div>
    </div>
  </section>

  <section
    class="min-h-screen p-8 flex flex-col gap-6"
    [style.background]="
      'linear-gradient(to bottom,' + contentColor + ' 0%,' + '#121212 100%)'
    ">
    <ng-content></ng-content>
  </section>
