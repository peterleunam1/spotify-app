<section
  class="relative w-full min-h-screen bg-[#0a0a0a] text-white overflow-hidden"
  [class.zooming]="isLoading">
  <div class="absolute inset-0">
    <img
      src="https://res.cloudinary.com/dxnwtczsm/image/upload/v1774738235/preview_dtmtsp.png"
      class="w-full h-full object-cover scale-110 blur-[12px] opacity-70"
      alt="dashboard preview" />
    <div
      class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/60 to-black/50"></div>
  </div>

  <div class="absolute inset-0">
    <div
      class="absolute w-[400px] h-[400px] bg-[#1DB954]/10 blur-[120px] rounded-full top-[-100px] left-[-100px]"></div>
    <div
      class="absolute w-[300px] h-[300px] bg-[#1DB954]/5 blur-[120px] rounded-full bottom-[-100px] right-[-100px]"></div>
  </div>

  <div
    class="relative z-10 flex flex-col justify-center min-h-screen px-8 lg:px-20">
    <div class="glass max-w-[100%] md:max-w-3xl p-10 rounded-2xl">
      <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold leading-tight reveal">
        Spotify <span class="text-[#1DB954]">Insight</span>
      </h1>

      <p class="text-basetext-gray-400 md:text-lg mt-6 max-w-xl reveal delay-1">
        Dive into your listening habits with clear insights on your top artists,
        tracks and trends — all in one clean experience.
      </p>

      <div class="flex gap-6 mt-8 reveal delay-2 mb-10 flex-wrap">
        <div class="stat flex items-center gap-3">
          <span class="stat-number">128</span>
          <span class="stat-label">Artists</span>
        </div>

        <div class="stat flex items-center gap-3">
          <span class="stat-number">542</span>
          <span class="stat-label">Tracks</span>
        </div>

        <div class="stat flex items-center gap-3">
          <span class="stat-number">32h</span>
          <span class="stat-label">Listening</span>
        </div>
      </div>

      <app-main-button
        (click)="onLogin()"
        [label]="'Connect with Spotify'"
        [isLoading]="isLoading">
      </app-main-button>
    </div>
  </div>
</section>
