<app-main-layout>
  <app-navbar [isSearchVisible]="false"></app-navbar>
  <section class="px-8 flex flex-col gap-8 pb-8">
    <header>
      <h1 class="text-3xl font-semibold">Dashboard</h1>
      <p class="text-neutral-400 text-sm">Your music at a glance.</p>
    </header>

    <section class="flex gap-8 w-full">
      <article class="flex flex-col gap-8 w-[45%]">
        <app-currently-playing
          class="w-full"
          [track]="currentlyPlaying"
          [refresh]="getCurrentlyPlaying.bind(this)">
        </app-currently-playing>

        <app-card class="w-full">
          <app-section-header
            title="Top Genres"
            description="Your core sound profile">
          </app-section-header>

          <app-radar-chart
            *ngIf="radarChartTopGenres()"
            [data]="radarChartTopGenres()!">
          </app-radar-chart>
        </app-card>
      </article>
      <app-repeat-and-stats class="w-[55%]" [tracks]="recentlyPlayedTracks()!">
      </app-repeat-and-stats>
    </section>

    <app-list-of-songs
      [tracks]="recentlyPlayed().slice(0, 5)"
      [albumName]="'Recently Played'"
      [showLike]="false"
      [minTracks]="7"
      [titleSmall]="true">
    </app-list-of-songs>


    <app-top-items
      mode="compact"
      type="artists"
      title="Top Artists"
      description="Your favorites right now"
      [artists]="artists()"
      [isLoading]="artistsLoading()"
      (rangeChange)="getTopArtists($event)">
    </app-top-items>

    <app-top-items
      mode="compact"
      type="tracks"
      title="Top Tracks"
      description="Your most played songs"
      [tracks]="tracks()"
      [isLoading]="tracksLoading()"
      (rangeChange)="getTopTracks($event)">
    </app-top-items>
  </section>
</app-main-layout>
