<app-main-layout>

  <app-navbar [isSearchVisible]="false"></app-navbar>

  <app-top-items
    type="artists"
    title="Top Artists"
    [artists]="artists()"
    [isLoading]="artistsLoading()"
    (rangeChange)="getTopArtists($event)">
  </app-top-items>

  <hr class="border-[#2a2a2a] my-8">

  <app-top-items
    type="tracks"
    title="Top Tracks"
    [tracks]="tracks()"
    [isLoading]="tracksLoading()"
    (rangeChange)="getTopTracks($event)">
  </app-top-items>
  <app-radar-chart
    [data]="radarChartTopGenres()!">
  </app-radar-chart>
  <app-music-dna
    [data]="radarChartData()!"
    [insights]="musicInsights()"
    [personality]="personality()">
  </app-music-dna>

</app-main-layout>
