<app-main-layout>
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <app-spotify-hero
    *ngIf="albumResponse?.images?.length"
    [img]="albumResponse.images?.[0]?.url || ''"
    [title]="albumResponse.name || ''"
    [contentType]="'album'"
    [description]="albumDescription">
    <app-list-of-songs
  [tracks]="tracks"
  [albumName]="'Songs'"
  [showLike]="true"
  [isLoading]="isLoading"
  >
</app-list-of-songs>
     <!-- ===== POPULARITY ===== -->
      <app-percentage-bar
        *ngIf="albumResponse?.popularity !== undefined"
        [title]="'Album popularity'"
        [percentage]="albumResponse.popularity">
      </app-percentage-bar>

      <div
        *ngIf="albumResponse.genres?.length"
        class="text-sm text-gray-300">
        <span class="font-semibold text-white">Genres:</span>

        <span *ngFor="let genre of albumResponse.genres; let last = last">
          {{ genre }}<span *ngIf="!last"> • </span>
        </span>
      </div>

      <!-- ===== LABEL ===== -->
      <div class="text-sm text-gray-400">
        <span class="font-semibold text-white">Label:</span>
        {{ albumResponse.label }}
      </div>

      <!-- ===== COPYRIGHT ===== -->
      <div class="text-xs text-gray-400 space-y-1">
        <p *ngFor="let copyright of albumResponse.copyrights">
          {{ copyright.text }}
        </p>
      </div>
    
  </app-spotify-hero>
</app-main-layout>
