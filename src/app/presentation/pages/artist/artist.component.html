<app-main-layout>
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <ng-container *ngIf="artistResource.state() as artistState">
    <app-resource-state
      [state]="artistState.state"
      [error]="artistState.error"
      [skeletonProps]="{ type: 'hero', count: 5 }"
      [emptyMessage]="'Artist not found'">
      <app-spotify-hero
        *ngIf="artist() as artist"
        [img]="artist.images[0].url || ''"
        [title]="artist.name"
        [contentType]="'artist'"
        [description]="artist.followers.total + ' followers'">
        <ng-container *ngIf="tracksResource.state() as tracksState">
          <app-section-header
            [title]="
              'Top Tracks' +
              (tracksState.data.length
                ? ' (' + tracksState.data.length + ')'
                : '')
            "
            description="The songs you’ve played the most from this artist, based on your listening habits.">
          </app-section-header>
          <app-resource-state
            [state]="tracksState.state"
            [error]="tracksState.error"
            [skeletonProps]="{ type: 'song', count: 3 }"
            [emptyMessage]="'No liked tracks from this artist yet'">
            <app-list-of-songs [tracks]="likedTracks()"> </app-list-of-songs>
          </app-resource-state>
        </ng-container>

        <app-percentage-bar
          *ngIf="artist.popularity !== undefined"
          [title]="'Artist popularity'"
          [percentage]="artist.popularity">
        </app-percentage-bar>

        <ng-container *ngIf="albumsResource.state() as albumsState">
          <app-resource-state
            [state]="albumsState.state"
            [error]="albumsState.error"
            [skeletonProps]="{ type: 'card', count: 6 }"
            [emptyMessage]="'No albums available'">
            <div>
              <h2 class="text-2xl font-bold mb-6">Discography</h2>
              <app-list-of-albums [albums]="albums()"> </app-list-of-albums>
            </div>
          </app-resource-state>
        </ng-container>
      </app-spotify-hero>
    </app-resource-state>
  </ng-container>
</app-main-layout>
