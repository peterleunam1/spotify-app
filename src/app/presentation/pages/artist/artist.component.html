<app-main-layout>
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <app-spotify-hero
    [img]="artistInfo.images[0].url"
    [title]="artistInfo.name"
    [contentType]="'artist'"
    [description]="artistInfo.followers?.total + ' followers'"
    [isLoading]="isLoading"
    >
<app-list-of-songs
  [tracks]="likedTracksFromArtist"
  [albumName]="'Liked Songs' + ' (' + likedTracksFromArtist.length + ')'"
  [isLoading]="isLoadingTracks">
</app-list-of-songs>
  
       <app-percentage-bar
        *ngIf="artistInfo.popularity !== undefined"
        [title]="'Artist popularity'"
        [percentage]="artistInfo.popularity">
      </app-percentage-bar>


      <!-- ===== DISCOGRAPHY ===== -->
      <div>
        <h2 class="text-2xl font-bold mb-6">Discography</h2>

        <app-list-of-albums [albums]="albums">
          <app-loader *ngIf="isLoadingAlbum" [message]="'Loading albums...'">
          </app-loader>
        </app-list-of-albums>
      </div>
  </app-spotify-hero>
</app-main-layout>
