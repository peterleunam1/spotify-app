<app-main-layout>
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <app-spotify-hero
    [img]="artistInfo.images[0].url"
    [title]="artistInfo.name"
    [contentType]="'artist'"
    [description]="artistInfo.followers?.total + ' followers'">
    <!-- ===== YOUR LIKED SONGS ===== -->
    <!-- ===== YOUR LIKED SONGS ===== -->
    <app-loader *ngIf="isLoadingTracks" [message]="'Loading liked songs...'">
    </app-loader>
<app-list-of-songs
  [tracks]="likedTracksFromArtist"
  [albumName]="'Liked Songs' + ' (' + likedTracksFromArtist.length + ')'"
  [isLoading]="isLoadingTracks">
</app-list-of-songs>
