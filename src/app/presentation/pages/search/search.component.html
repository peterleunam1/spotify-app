<app-main-layout>
  <app-navbar [(keyword)]="keyword"></app-navbar>
  <div *ngIf="isLoading && listSingers.length === 0" class="p-8">
    <app-skeleton [type]="'card'" [count]="10"></app-skeleton>
  </div>
  <section
    class="flex flex-col px-4 md:px-8 gap-8 mt-6 pb-22 md:pb-8"
    *ngIf="!keyword && recentSearches.length > 0">
    <div
      *ngIf="
        !keyword &&
        recentSearches.length > 0 &&
        !isLoading &&
        listSingers.length === 0
      ">
      <div class="flex justify-between items-center w-full mb-4 md:mb-8">
        <h1 class="text-2xl font-semibold">Recent searches</h1>

        <button
          (click)="clearRecentSearches()"
          class="text-sm text-gray-400 hover:text-white transition cursor-pointer">
          Clear all
        </button>
      </div>

      <app-list-of-singers
        class="w-full"
        [singers]="recentSearches"
        [showRemoveButton]="true"
        (remove)="removeRecentSearch($event)"></app-list-of-singers>
    </div>
  </section>
  <!-- <div
    *ngIf="!keyword && !isLoading && listSingers.length === 0"
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 px-4 md:p-8 pb-26 md:pb-8 mt-12 md:mt-0">
    <div
      *ngFor="let category of categories"
      class="h-32 flex items-end p-4 rounded-xl text-white font-bold text-xl cursor-pointer transition-transform transform hover:scale-105"
      [ngStyle]="{ 'background-color': category.color }">
      {{ category.name }}
    </div>
  </div> -->
  <div class="p-4 md:p-8" *ngIf="listSingers.length > 0">
    <app-list-of-singers
      [singers]="listSingers"
      [showRemoveButton]="false"></app-list-of-singers>
  </div>
  <p
    *ngIf="listSingers.length === 0 && !isLoading && keyword"
    class="text-center text-gray-400 text-lg font-medium py-8">
    We couldn’t find anything in artists, albums, or songs.
    <span class="block text-sm text-gray-500 mt-2">
      Try a different search term or explore the categories below 👇
    </span>
  </p>
</app-main-layout>
