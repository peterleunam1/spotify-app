<app-main-layout>
  <app-navbar [(keyword)]="keyword"></app-navbar>
  <div *ngIf="isLoading" class="my-4">
    <app-loader [message]="'Loading ...'" />
  </div>
<section class="flex flex-col px-8 gap-8 mt-2 pb-8"  *ngIf="!keyword && recentSearches.length > 0">
    <div
      *ngIf="
        !keyword &&
        recentSearches.length > 0 &&
        !isLoading &&
        listSingers.length === 0
      "
     >
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-semibold">Recent searches</h1>

        <button
          (click)="clearRecentSearches()"
          class="text-sm text-gray-400 hover:text-white transition cursor-pointer">
          Clear all
        </button>
      </div>

      <app-list-of-singers
        [singers]="recentSearches"
        [showRemoveButton]="true"
        (remove)="removeRecentSearch($event)"></app-list-of-singers>
    </div>
  <div
    *ngIf="!keyword && !isLoading && listSingers.length === 0"
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div
      *ngFor="let category of categories"
      class="h-32 flex items-end p-4 rounded-xl text-white font-bold text-xl cursor-pointer transition-transform transform hover:scale-105"
      [ngStyle]="{ 'background-color': category.color }">
      {{ category.name }}
    </div>
  </div>
</section>
  <app-list-of-singers
    *ngIf="listSingers.length > 0"
    [singers]="listSingers"
    [showRemoveButton]="false"></app-list-of-singers>
</app-main-layout>
