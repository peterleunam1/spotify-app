<app-main-layout>

  <!-- NAVBAR -->
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <!-- HERO -->
  <app-spotify-hero
    [img]="track.album.images[0].url"
    [title]="track.name"
    [contentType]="'track'"
    [description]="track.artists[0].name">

 <div
      class="grid md:grid-cols-2 gap-10
    "
    >

      <!-- LEFT -->
      <div class="space-y-4 text-sm">

        <div>
          <p class="text-gray-400">Album</p>
          <p class="font-semibold">{{ track.album.name }}</p>
        </div>

        <div>
          <p class="text-gray-400">Track</p>
          <p class="font-semibold">
            #{{ track.track_number }} of {{ track.album.total_tracks }}
          </p>
        </div>

        <div>
          <p class="text-gray-400">Duration</p>
          <p class="font-semibold">
            {{ formatDuration(track.duration_ms) }}
          </p>
        </div>

        <div>
          <p class="text-gray-400">Release Date</p>
          <p class="font-semibold">
            {{ track.album.release_date }}
          </p>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="space-y-4 text-sm">

        <!-- POPULARITY -->
        <app-percentage-bar
          [title]="'Popularity'"
          [percentage]="track.popularity"
          >
        </app-percentage-bar>

        <!-- EXPLICIT -->
        <div *ngIf="track.explicit">
          <p class="text-gray-400">Explicit</p>
          <span
            class="text-xs bg-zinc-700 px-2 py-1 rounded"
          >
            Explicit
          </span>
        </div>

        <!-- ISRC -->
        <div class="mt-4">
          <p class="text-gray-400">ISRC</p>
          <p class="font-mono text-xs">
            {{ track.external_ids.isrc }}
          </p>
        </div>

      </div>

    </div>
  </app-spotify-hero>

</app-main-layout>
