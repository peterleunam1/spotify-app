<app-main-layout>
  <app-navbar
    [isSearchVisible]="false"
    [spotifyEffect]="true"
    [dominantColor]="dominantColor">
  </app-navbar>

  <ng-container *ngIf="playlistResource.state() as state">
    <app-resource-state
      [state]="state.state"
      [error]="state.error"
      [skeletonProps]="{ type: 'hero', count: 5 }"
      [emptyMessage]="'Playlist not found'">
      <app-spotify-hero
        *ngIf="playlist() as playlist"
        [img]="playlist.images?.[0]?.url || ''"
        [title]="playlist.name"
        [contentType]="'playlist'"
        [description]="description()">
        <!-- SONGS -->
        <app-section-header
          [title]="
            'Tracks' + (songs().length ? ' (' + songs().length + ')' : '')
          "></app-section-header>
        <app-list-of-songs [tracks]="songs()" [showLike]="true" [minTracks]="5">
        </app-list-of-songs>
      </app-spotify-hero>
    </app-resource-state>
  </ng-container>
</app-main-layout>
