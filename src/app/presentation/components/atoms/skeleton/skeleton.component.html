<div class="grid gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-5">

  <div
    *ngFor="let item of [].constructor(count)"
    class="animate-pulse"
  >
    
    <!-- CARD (tipo Spotify artist/track) -->
    <ng-container *ngIf="type === 'card'">
      <div class="flex flex-col gap-3">

        <!-- imagen -->
        <div class="w-full aspect-square bg-[#2a2a2a] rounded-lg"></div>

        <!-- texto -->
        <div class="h-3 w-3/4 bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-1/2 bg-[#2a2a2a] rounded"></div>

      </div>
    </ng-container>

    <!-- CIRCLE (tipo artist avatar) -->
    <ng-container *ngIf="type === 'circle'">
      <div class="flex flex-col items-center gap-3">

        <div class="w-36 h-36 bg-[#2a2a2a] rounded-full"></div>
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>

      </div>
    </ng-container>

    <!-- TEXT -->
    <ng-container *ngIf="type === 'text'">
      <div class="flex flex-col gap-2">
        <div class="h-3 w-full bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-5/6 bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-2/3 bg-[#2a2a2a] rounded"></div>
      </div>
    </ng-container>

    
  </div>
  
</div>
<ng-container *ngIf="type === 'big-circle'">
  <div class="size-90 bg-[#2a2a2a] rounded-full animate-pulse"></div>
</ng-container>

<!-- SONG LIST -->
<ng-container *ngIf="type === 'song'">
  <div class="flex flex-col gap-3 animate-pulse">

    <div
      *ngFor="let item of [].constructor(count); index as i"
      class="flex items-center justify-between animate-pulse px-2 py-2 rounded-md"
    >

      <!-- LEFT SIDE -->
      <div class="flex items-center gap-3 w-full">

        <!-- index / play -->
        <div class="w-4 h-4 bg-[#2a2a2a] rounded-sm"></div>

        <!-- cover -->
        <div class="w-10 h-10 bg-[#2a2a2a] rounded"></div>

        <!-- title + artist -->
        <div class="flex flex-col gap-2 flex-1">
          <div class="h-3 w-2/5 bg-[#2a2a2a] rounded"></div>
          <div class="h-3 w-1/4 bg-[#2a2a2a] rounded"></div>
        </div>

      </div>

      <!-- duration -->
      <div class="h-3 w-10 bg-[#2a2a2a] rounded"></div>

    </div>

  </div>
</ng-container>
