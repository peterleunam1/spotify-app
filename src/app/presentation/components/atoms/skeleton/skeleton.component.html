<div class="grid gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-5">
  <div *ngFor="let item of [].constructor(count)" class="animate-pulse">
    <ng-container *ngIf="type === 'card'">
      <div class="flex flex-col gap-3">
        <div class="w-full aspect-square bg-[#2a2a2a] rounded-lg"></div>
        <div class="h-3 w-3/4 bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-1/2 bg-[#2a2a2a] rounded"></div>
      </div>
    </ng-container>

    <ng-container *ngIf="type === 'circle'">
      <div class="flex flex-col items-center gap-3">
        <div class="w-36 h-36 bg-[#2a2a2a] rounded-full"></div>
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
      </div>
    </ng-container>

    <ng-container *ngIf="type === 'text'">
      <div class="flex flex-col gap-2">
        <div class="h-3 w-full bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-5/6 bg-[#2a2a2a] rounded"></div>
        <div class="h-3 w-2/3 bg-[#2a2a2a] rounded"></div>
      </div>
    </ng-container>
  </div>
</div>
<ng-container *ngIf="type === 'big-circle'">
  <div class="size-90 bg-[#2a2a2a] rounded-full animate-pulse"></div>
</ng-container>

<ng-container *ngIf="type === 'song'">
  <div class="flex flex-col gap-3 animate-pulse">
    <div
      *ngFor="let item of [].constructor(count); index as i"
      class="flex items-center justify-between animate-pulse px-2 py-2 rounded-md">
      <div class="flex items-center gap-3 w-full">
        <div class="w-4 h-4 bg-[#2a2a2a] rounded-sm"></div>
        <div class="w-10 h-10 bg-[#2a2a2a] rounded"></div>
        <div class="flex flex-col gap-2 flex-1">
          <div class="h-3 w-2/5 bg-[#2a2a2a] rounded"></div>
          <div class="h-3 w-1/4 bg-[#2a2a2a] rounded"></div>
        </div>
      </div>
      <div class="h-3 w-10 bg-[#2a2a2a] rounded"></div>
    </div>
  </div>
</ng-container>

<!-- HERO -->
<ng-container *ngIf="type === 'hero'">
  <div class="w-full flex flex-col gap-6 p-6 animate-pulse">

    <!-- MOBILE LAYOUT -->
    <div class="flex flex-col items-center gap-4 md:hidden">

      <!-- Imagen -->
      <div class="w-48 h-48 bg-[#3a3a3a] rounded-lg"></div>

      <!-- Type -->
      <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>

      <!-- Title -->
      <div class="h-8 w-40 bg-[#2a2a2a] rounded"></div>

      <!-- Artist -->
      <div class="h-4 w-32 bg-[#2a2a2a] rounded"></div>

    </div>

    <!-- EXTRA INFO (mobile stacked) -->
    <div class="flex flex-col gap-3 md:hidden">

      <div class="flex flex-col gap-2">
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
        <div class="h-4 w-32 bg-[#3a3a3a] rounded"></div>
      </div>

      <div class="flex flex-col gap-2">
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
        <div class="h-4 w-40 bg-[#3a3a3a] rounded"></div>
      </div>

      <div class="flex flex-col gap-2">
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
        <div class="h-4 w-24 bg-[#3a3a3a] rounded"></div>
      </div>

    </div>

    <!-- DESKTOP LAYOUT (tu versión anterior) -->
    <div class="hidden md:flex items-end gap-6">
      
      <div class="w-40 h-40 bg-[#3a3a3a] rounded-lg"></div>

      <div class="flex flex-col gap-4 flex-1">
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
        <div class="h-10 w-2/3 bg-[#2a2a2a] rounded"></div>
        <div class="h-4 w-40 bg-[#2a2a2a] rounded"></div>
      </div>

    </div>

  </div>
</ng-container>

<ng-container *ngIf="type === 'stats'">
  <div class="flex flex-col gap-6 animate-pulse">
    <div class="flex flex-col gap-2">
      <div class="h-10 w-dull bg-[#2a2a2a] rounded"></div>
      <div class="h-10 w-56 bg-[#2a2a2a] rounded"></div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div
        *ngFor="let item of [].constructor(count || 6)"
        class="p-4 rounded-lg bg-[#1f1f1f] flex flex-col gap-3">
        <div class="h-3 w-16 bg-[#2a2a2a] rounded"></div>
        <div class="h-5 w-20 bg-[#3a3a3a] rounded"></div>
      </div>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="type === 'dna'">
  <div class="flex flex-col gap-6 animate-pulse">
    <div class="flex flex-col gap-2">
      <div class="h-6 w-40 bg-[#2a2a2a] rounded"></div>
      <div class="h-4 w-56 bg-[#2a2a2a] rounded"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-[#1f1f1f] rounded-xl p-6 flex items-center justify-center">
        <div class="w-64 h-64 rounded-full bg-[#2a2a2a]"></div>
      </div>
      <div class="flex flex-col gap-4">
        <div class="bg-[#1f1f1f] rounded-xl p-5 flex flex-col gap-3">
          <div class="h-4 w-40 bg-[#2a2a2a] rounded"></div>
          <div class="h-3 w-64 bg-[#2a2a2a] rounded"></div>
          <div class="flex flex-col gap-2 mt-2">
            <div class="h-3 w-40 bg-[#3a3a3a] rounded"></div>
            <div class="h-3 w-44 bg-[#3a3a3a] rounded"></div>
          </div>
        </div>
        <div class="bg-[#1f1f1f] rounded-xl p-5 flex flex-col gap-3">
          <div class="h-4 w-48 bg-[#2a2a2a] rounded"></div>
          <div class="h-3 w-60 bg-[#2a2a2a] rounded"></div>

          <div class="flex items-center gap-3 mt-2">
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a]"></div>
            <div class="flex flex-col gap-2">
              <div class="h-3 w-36 bg-[#3a3a3a] rounded"></div>
              <div class="h-3 w-52 bg-[#3a3a3a] rounded"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
