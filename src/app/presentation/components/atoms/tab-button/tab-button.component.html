<button
  (click)="onClick()"
  class="px-4 py-2 text-sm font-medium rounded-full transition-all duration-300 cursor-pointer"
  [ngClass]="{
    'bg-green-500 text-black shadow-md scale-105': active && variant === 'primary',
    'bg-[#282828] text-white hover:bg-[#3e3e3e]': !active && variant === 'primary',

    'bg-neutral-200 text-black': active && variant === 'subtle',
    'bg-neutral-800 text-neutral-300 hover:bg-neutral-700': !active && variant === 'subtle'
  }"
>
  {{ label }}
</button>
