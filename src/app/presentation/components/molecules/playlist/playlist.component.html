<a
  [routerLink]="['/', 'playlist', playlist.id]"
  [attr.aria-label]="'Ir a ' + playlist.id">
  <div
    tabindex="0"
    class="relative bg-[#181818] w-full md:max-w-52 shadow-md rounded-lg p-4 transition-transform transform duration-300 hover:scale-105 hover:shadow-xl hover:bg-[#282828] cursor-pointer flex flex-col">
    <div class="relative w-full md:h-52 h-40">
      <img
        [src]="playlistImage()"
        [alt]="playlist.name"
        class="w-full h-full object-cover rounded-md" />
    </div>

    <div class="flex flex-col items-center justify-center text-center mt-2">
      <h3 class="text-sm font-bold text-white truncate w-full px-2">
        {{ playlist.name }}
      </h3>
      <p class="text-xs text-gray-400 truncate w-full px-2">
        {{ playlist.owner.display_name }}
      </p>
    </div>
  </div></a
>
