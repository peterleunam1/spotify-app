<header
  class="fixed top-0 left-0 w-full md:w-[calc(100%-245px)] md:ml-[245px] z-50 h-[74px] md:h-[64px] flex items-center px-2 sm:px-6 justify-between text-white transition-all duration-300"
  [style.background]="
    spotifyEffect ? dominantColorService.dominantColor() : '#1e1e1e'
  ">
  <div class="flex items-center space-x-4 w-2/3">
    <div class="space-x-3 hidden sm:flex">
      <button
        (click)="goBack()"
        class="w-9 h-9 flex items-center justify-center rounded-full bg-black/40 hover:bg-black/70 transition-all duration-200 cursor-pointer">
        <i class="fas fa-chevron-left text-sm"></i>
      </button>

      <button
        (click)="goForward()"
        class="w-9 h-9 flex items-center justify-center rounded-full bg-black/40 hover:bg-black/70 transition-all duration-200 cursor-pointer">
        <i class="fas fa-chevron-right text-sm"></i>
      </button>
    </div>

    <app-input
      *ngIf="isSearchVisible"
      [type]="'text'"
      [placeholder]="'Find your favorite artists...'"
      (valueChange)="updateName($event)"
      class="w-full sm:w-96">
    </app-input>
  </div>

  <div class="relative text-white" *ngIf="profile.images">
    <button
      (click)="toggleDropdown()"
      class="cursor-pointer flex items-center space-x-2 hover:bg-[#282828] md:p-2 rounded-lg transition">
      <img
        *ngIf="profile.images.length > 0"
        [src]="profile.images[0].url"
        alt="Profile Picture"
        class="size-10 rounded-full" />

        <span
          *ngIf="profile.images.length === 0"
          class="size-10 rounded-full bg-gray-500 flex items-center justify-center text-white"
        >
      {{ profile.display_name.charAt(0) }}
      </span>

      <span class="hidden md:block font-semibold">{{ profile.display_name }}</span>
    </button>

    <div
      *ngIf="isDropdownOpen"
      class="absolute right-0 mt-2 w-40 bg-[#282828] text-white shadow-lg rounded-lg overflow-hidden z-10">
      <button
        (click)="logout()"
        class="w-full text-left px-4 py-2 hover:bg-[#3e3e3e] transition cursor-pointer">
        Logout
      </button>
    </div>
  </div>
</header>
