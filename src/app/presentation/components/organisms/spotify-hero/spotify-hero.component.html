<section
  class="relative w-full min-h-[350px] h-auto md:h-[270px] flex-shrink-0 pb-6 md:pb-0"
  [style.background]="
    'linear-gradient(to bottom,' +
    dominantColor +
    ' 0%,' +
    darkDominantColor +
    ' 100%)'
  ">
  <div class="flex flex-col md:flex-row items-center md:items-end gap-6 h-full px-4 md:p-8 text-white">
    <img
      [src]="img"
      class="size-54 shadow-2xl object-cover rounded"
      alt="Artist"
      *ngIf="!isLoading" />
    <app-skeleton
      *ngIf="isLoading"
      [type]="'circle'"
      [count]="1"></app-skeleton>

    <div class="w-full md:w-auto">
      <p class="text-sm uppercase tracking-widest text-gray-300">
        {{ contentType | uppercase }}
      </p>

      <h1 class="text-4xl md:text-6xl font-bold leading-tight" *ngIf="!isLoading">
        {{ title }}
      </h1>

      <app-skeleton
        *ngIf="isLoading"
        [type]="'text'"
        [count]="1"></app-skeleton>

      <p class="text-sm text-gray-300 mt-2">
        {{ description }}
      </p>
    </div>
  </div>
</section>

<section
  class="p-4 md:p-8 flex flex-col gap-6 flex-1 min-h-0 overflow-auto pb-24 md:pb-8"
  [style.background]="
    'linear-gradient(to bottom,' + contentColor + ' 0%,' + '#121212 100%)'
  ">
  <ng-content></ng-content>
</section>
