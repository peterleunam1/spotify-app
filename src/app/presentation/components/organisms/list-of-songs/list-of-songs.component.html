<div *ngIf="tracks.length" class="w-full">
  <!-- <app-section-header [title]="albumName"></app-section-header> -->
  <div class="space-y-1">
    <div
      *ngFor="let item of visibleTracks; let i = index"
      class="group grid items-center gap-4 px-0 md:px-4 py-2 rounded-md hover:bg-white/10 cursor-pointer transition grid-cols-[40px_48px_1fr_100px]"
      (click)="handleRedirect(item.id)">
      <div class="flex items-center justify-center text-gray-400">
        <span class="group-hover:hidden">
          {{ i + 1 }}
        </span>

        <svg
          class="hidden group-hover:block w-4 h-4 fill-white"
          viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>

      <img
        [src]="item.albumImage"
        class="w-10 h-10 object-cover rounded"
        alt="album cover" />

      <div class="truncate">
        <p class="truncate font-medium">
          {{ item.title }}
        </p>

        <p class="text-sm text-gray-400 truncate">
          {{ item.albumName }}
        </p>
      </div>
      <div class="text-sm text-gray-400 text-right" *ngIf="item.duration">
        {{ formatDuration(item.duration) }}
      </div>
      <div class="text-sm text-gray-400 text-right" *ngIf="item.timeAgo">
        {{ item.timeAgo }}
      </div>
    </div>
  </div>

  <button
    *ngIf="tracks.length > minTracks"
    (click)="toggleTracks()"
    class="mt-4 text-sm font-semibold text-gray-400 hover:text-white transition cursor-pointer">
    {{ showAllTracks ? 'Show less' : 'Show more' }}
  </button>
</div>
