<div *ngIf="tracks.length || !isLoading">

  <h2 class="text-2xl font-bold mb-6">
    {{ albumName }}
  </h2>

  <div *ngIf="!isLoading; else loading">

    <div class="space-y-1">

      <div
        *ngFor="let item of visibleTracks; let i = index"
class="group grid items-center gap-4 px-4 py-2 rounded-md hover:bg-white/10 cursor-pointer transition"
[ngClass]="showLike 
  ? 'grid-cols-[40px_48px_1fr_40px_80px]' 
  : 'grid-cols-[40px_48px_1fr_80px]'"      >

        <!-- NUMBER / PLAY -->
        <div class="flex items-center justify-center text-gray-400">

          <span class="group-hover:hidden">
            {{ i + 1 }}
          </span>

          <svg
            class="hidden group-hover:block w-4 h-4 fill-white"
            viewBox="0 0 24 24">

            <path d="M8 5v14l11-7z"/>

          </svg>

        </div>

        <!-- ALBUM COVER -->
        <img
          [src]="
            item.albumImage
          "
          class="w-10 h-10 object-cover rounded"
          alt="album cover"
        />

        <!-- TRACK INFO -->
        <div class="truncate">

          <p class="truncate font-medium">
            {{ item.title}}
          </p>

          <p class="text-sm text-gray-400 truncate">
            {{ item.albumName }}
          </p>

        </div>

        <!-- LIKE -->
<div
  *ngIf="showLike"
  class="flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
>
  <svg
    class="w-4 h-4 fill-gray-400 hover:fill-green-500 cursor-pointer"
    viewBox="0 0 24 24"
  >
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
             2 6 4 4 6.5 4 
             c1.74 0 3.41 1.01 4.22 2.59 
             C11.09 5.01 12.76 4 14.5 4 
             17 4 19 6 19 8.5 
             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
</div>

        <!-- DURATION -->
        <div class="text-sm text-gray-400 text-right">
          {{ formatDuration(item.duration) }}
        </div>

      </div>

      

    </div>

    <!-- SHOW MORE / LESS -->
    <button
      *ngIf="tracks.length > minTracks"
      (click)="toggleTracks()"
      class="mt-4 text-sm font-semibold text-gray-400 hover:text-white transition cursor-pointer"
    >
      {{ showAllTracks ? 'Show less' : 'Show more' }}
    </button>

  </div>

</div>

<ng-template #loading>
  <app-loader [message]="'Loading liked songs...'" />
</ng-template>
