<div *ngIf="!isLoading && playlists.length > 0" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 md:gap-6 gap-4">
  <app-playlist
    *ngFor="let playlist of playlists"
    [playlist]="playlist"
    (playlistClick)="openPlaylist($event)">
  </app-playlist>
</div>

<div
  *ngIf="!isLoading && playlists.length === 0"
  class="text-center text-lg text-gray-400 mt-6">
  There are no playlists available.
</div>

<app-skeleton *ngIf="isLoading" [count]="5" [type]="'card'"></app-skeleton>
