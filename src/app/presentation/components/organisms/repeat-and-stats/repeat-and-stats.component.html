<section class="flex flex-col gap-8 w-full">
  <app-card>
    <app-section-header
      title="On Repeat"
      description="Your most played tracks right now">
    </app-section-header>

    <div class="flex gap-2 md:gap-4 flex-wrap">
      <app-singer
        *ngFor="let track of onRepeatTracks"
        [singer]="{
          id: track.id,
          name: track.name,
          image: track.albumImage,
          genres: [],
          type: 'track',
          singerNameFromTrack: track.artist
        }"
        [showRank]="true"
        [rank]="onRepeatTracks.indexOf(track) + 1"
        [isSmall]="true">
      </app-singer>
    </div>
  </app-card>

  <app-card>
    <app-section-header
      title="Your Stats"
      description="Your activity for {{ todayLabel }}">
    </app-section-header>

    <app-stats [tracks]="tracks"></app-stats>
  </app-card>
</section>
