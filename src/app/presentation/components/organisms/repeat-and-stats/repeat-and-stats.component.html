<section class="flex flex-col gap-8 w-full">
  <!-- 🔁 ON REPEAT -->
   <app-card>
    <app-section-header
      title="On Repeat 🔁"
      description="Your most played tracks right now">
    </app-section-header>

    <div class="flex gap-4">
      <app-singer
        *ngFor="let track of onRepeatTracks"
        [singer]="{
          id: track.id,
          name: track.name,
          image: track.albumImage,
          genres: [],
          type: 'track',
          singerNameFromTrack: track.artist
        }"
        [showRank]="true"
        [rank]="onRepeatTracks.indexOf(track) + 1"
        [isSmall]="true">
      </app-singer>
    </div>
    </app-card>

  <!-- 📊 QUICK STATS -->
  <app-card>
    <app-section-header 
        title="Your Stats"
        description="Your activity for {{ todayLabel }}">
    </app-section-header>

    <div class="grid grid-cols-2 gap-4">
      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Tracks</p>
        <p class="text-lg font-semibold">{{ stats.totalTracks }}</p>
      </div>

      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Hours</p>
        <p class="text-lg font-semibold">{{ stats.totalHours }}</p>
      </div>

      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Artists</p>
        <p class="text-lg font-semibold">{{ stats.totalArtists }}</p>
      </div>

      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Peak Day</p>
        <p class="text-lg font-semibold">{{ stats.peakDay }}</p>
      </div>
      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Top Artist</p>
        <p class="text-lg font-semibold truncate">{{ stats.topArtist }}</p>
      </div>

      <div class="bg-neutral-800 rounded-lg p-3">
        <p class="text-xs text-neutral-400">Avg Session</p>
        <p class="text-lg font-semibold">{{ stats.avgSessionMinutes }} min</p>
      </div>
    </div>
 </app-card>
</section>
