<section class="text-white flex flex-col gap-6 ">
    <div *ngIf="mode === 'interactive'" class="flex items-center justify-end gap-2 md:mt-[-2rem]">
      <app-time-ranger-selector
        class="scale-90 opacity-90"
        (rangeChange)="onTimeRangeChange($event)">
      </app-time-ranger-selector>
    </div>

  <app-skeleton
    [count]="5"
    type="card"
    *ngIf="stateLoad === 'loading' && type === 'tracks'"></app-skeleton>
  <app-skeleton
    [count]="5"
    type="circle"
    *ngIf="stateLoad === 'loading' && type === 'artists'"></app-skeleton>

  <article class="flex flex-col gap-5" *ngIf="stateLoad !== 'loading'">
    <div class="grid gap-4 grid-cols-2 sm:grid-cols-3 md:grid-cols-5">
      <ng-container *ngIf="type === 'artists'">
        <app-singer
          *ngFor="
            let artist of artists?.items || [] | slice: 0 : getLimit();
            index as i
          "
          [singer]="{
            id: artist.id,
            name: artist.name,
            image: artist.images[0].url || '',
            followers: artist.followers.total || 0,
            type: 'artist',
            artistNamefromAlbum: ''
          }"
          [showRank]="true"
          [rank]="i + 1"
          [highlightOnHover]="true"
          [showGenres]="mode === 'interactive'">
        </app-singer>
      </ng-container>
      <ng-container *ngIf="type === 'tracks'">
        <app-singer
          *ngFor="
            let track of tracks?.items || [] | slice: 0 : getLimit();
            index as i
          "
          [singer]="{
            id: track.id,
            name: track.name,
            image: track.album.images[0].url,
            followers: 0,
            genres: [],
            type: 'track',
            singerNameFromTrack: track.artists[0].name || ''
          }"
          [showRank]="true"
          [rank]="i + 1"
          [highlightOnHover]="true"
          [showGenres]="false">
        </app-singer>
      </ng-container>
    </div>
    <div
      *ngIf="
        mode === 'compact' && (artists?.items?.length || tracks?.items?.length)
      "
      class="flex justify-end">
      <button
        class="text-sm text-neutral-400 hover:text-white transition cursor-pointer"
        (click)="onSeeAll()">
        See all →
      </button>
    </div>
  </article>
</section>
