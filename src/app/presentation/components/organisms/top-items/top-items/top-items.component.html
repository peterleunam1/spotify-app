<section class="px-6 text-white">

  <h2 class="text-2xl md:text-3xl font-bold">
    {{ title }}
  </h2>

  <app-time-ranger-selector
    (rangeChange)="onTimeRangeChange($event)">
  </app-time-ranger-selector>

  <div *ngIf="isLoading" class="my-4">
    Loading...
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4">

    <!-- ARTISTS -->
    <ng-container *ngIf="type === 'artists'">
      <app-singer
        *ngFor="let artist of artists?.items?.slice(0,5); index as i"
        [singer]="{
          id: artist.id,
          name: artist.name,
          image: artist.images?.[0]?.url ?? '',
          followers: artist.followers?.total ?? 0,
          genres: artist.genres ?? [],
          type: 'artist',
          artistNamefromAlbum: ''
        }"
        [showRank]="true"
        [rank]="i + 1"
        [highlightOnHover]="true"
        [showGenres]="false">
      </app-singer>
    </ng-container>

    <!-- TRACKS -->
    <ng-container *ngIf="type === 'tracks'">
      <app-singer
        *ngFor="let track of tracks?.items?.slice(0,5); index as i"
        [singer]="{
          id: track.id,
          name: track.name,
          image: track.album.images?.[0]?.url ?? '',
          followers: 0,
          genres: [],
          type: 'track',
          singerNameFromTrack: track.artists?.[0]?.name ?? ''
        }"
        [showRank]="true"
        [rank]="i + 1"
        [highlightOnHover]="true"
        [showGenres]="false">
      </app-singer>
    </ng-container>

  </div>

</section>
