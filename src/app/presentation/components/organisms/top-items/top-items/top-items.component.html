<section class="text-white flex flex-col gap-6">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <app-section-header
      [title]="title"
      [description]="description"></app-section-header>
    <div *ngIf="mode === 'interactive'" class="flex items-center gap-2">
      <app-time-ranger-selector
        class="scale-90 opacity-90"
        (rangeChange)="onTimeRangeChange($event)">
      </app-time-ranger-selector>
    </div>
  </div>

  <article class="flex flex-col gap-5">
    <app-skeleton
      *ngIf="isLoading && type === 'artists'"
      [count]="5"
      [type]="'circle'"></app-skeleton>
    <app-skeleton
      *ngIf="isLoading && type === 'tracks'"
      [count]="5"
      [type]="'card'"></app-skeleton>

    <div
      class="grid gap-4 grid-cols-2 sm:grid-cols-3 md:grid-cols-5"
      *ngIf="!isLoading">
      <ng-container *ngIf="type === 'artists'">
        <app-singer
          *ngFor="
            let artist of artists?.items || [] | slice: 0 : getLimit();
            index as i
          "
          [singer]="{
            id: artist.id,
            name: artist.name,
            image: artist.images?.[0]?.url ?? '',
            followers: artist.followers?.total ?? 0,
            type: 'artist',
            artistNamefromAlbum: ''
          }"
          [showRank]="true"
          [rank]="i + 1"
          [highlightOnHover]="true"
          [showGenres]="mode === 'interactive'">
        </app-singer>
      </ng-container>
      <ng-container *ngIf="type === 'tracks'">
        <app-singer
          *ngFor="
            let track of tracks?.items || [] | slice: 0 : getLimit();
            index as i
          "
          [singer]="{
            id: track.id,
            name: track.name,
            image: track.album.images?.[0]?.url ?? '',
            followers: 0,
            genres: [],
            type: 'track',
            singerNameFromTrack: track.artists?.[0]?.name ?? ''
          }"
          [showRank]="true"
          [rank]="i + 1"
          [highlightOnHover]="true"
          [showGenres]="false">
        </app-singer>
      </ng-container>
    </div>
    <div *ngIf="mode === 'compact'" class="flex justify-end">
      <button
        class="text-sm text-neutral-400 hover:text-white transition"
        (click)="onSeeAll()">
        See all →
      </button>
    </div>
  </article>
</section>
